<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AAQMS Display</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 96px;
    height: 64px;
    background: #000000;
    overflow: hidden;
  }

  /* everything is sized in px on purpose — this is meant to be shown
     1:1 on a 96 x 64 pixel LED matrix / DMD panel */
  .screen {
    width: 96px;
    height: 64px;
    background: #000;
    font-family: 'Consolas', 'DejaVu Sans Mono', monospace;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .title {
    height: 9px;
    line-height: 9px;
    text-align: center;
    color: #ff1a1a;
    font-size: 7px;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-shadow: 0 0 2px #ff1a1a;
    white-space: nowrap;
    overflow: hidden;
  }

  .datetime {
    height: 8px;
    line-height: 8px;
    text-align: center;
    color: #29b6f6;
    font-size: 6px;
    letter-spacing: 0px;
    text-shadow: 0 0 2px #29b6f6;
    white-space: nowrap;
    overflow: hidden;
  }

  .rows {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 0 2px;
    box-sizing: border-box;
  }

  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    height: 9px;
    line-height: 9px;
  }

  .label {
    color: #33ff33;
    font-size: 7px;
    font-weight: bold;
    text-shadow: 0 0 2px #33ff33;
    width: 26px;
    flex-shrink: 0;
  }

  .value {
    color: #29b6f6;
    font-size: 8px;
    font-weight: bold;
    text-shadow: 0 0 2px #29b6f6;
    flex: 1;
    text-align: right;
  }

  .unit {
    color: #29b6f6;
    font-size: 5px;
    width: 14px;
    text-align: right;
    flex-shrink: 0;
  }

  .offline .value { color: #ff5252; text-shadow: 0 0 2px #ff5252; }
</style>
</head>
<body>
  <div class="screen" id="screen">
    <div class="title" id="title">AAQMS</div>
    <div class="datetime" id="datetime">--/--/---- --:--</div>
    <div class="rows" id="rows">
      <div class="row"><span class="label">PM2.5</span><span class="value" id="pm25">--</span><span class="unit">ug/m3</span></div>
      <div class="row"><span class="label">PM10</span><span class="value" id="pm10">--</span><span class="unit">ug/m3</span></div>
      <div class="row"><span class="label">AQI</span><span class="value" id="aqi">--</span><span class="unit"></span></div>
      <div class="row"><span class="label">TEMP</span><span class="value" id="temp">--</span><span class="unit">C</span></div>
      <div class="row"><span class="label">HUM</span><span class="value" id="hum">--</span><span class="unit">%</span></div>
    </div>
  </div>

  <script>
    // ---- CONFIGURE THIS -------------------------------------------------
    const API_URL = "https://ggespl.com/api/machine/data/?api_key=qyA21VIUjmLEENPkHtRbX_50V7emtvpNUT1vBpgGKZyGeyYSzE6MS6wD8Ef1x0e5";
    const REFRESH_MS = 30000; // how often to poll the API
    // -----------------------------------------------------------------------

    const el = {
      title:    document.getElementById('title'),
      datetime: document.getElementById('datetime'),
      screen:   document.getElementById('screen'),
      pm25: document.getElementById('pm25'),
      pm10: document.getElementById('pm10'),
      aqi:  document.getElementById('aqi'),
      temp: document.getElementById('temp'),
      hum:  document.getElementById('hum')
    };

    // Map the "type" field returned by the API to our on-screen element
    const sensorMap = {
      "PM2.5":    el.pm25,
      "PM10":     el.pm10,
      "AQI":      el.aqi,
      "Temp":     el.temp,
      "Humidity": el.hum
    };

    function formatValue(v, decimals) {
      const num = Number(v);
      if (Number.isNaN(num)) return "--";
      return num.toFixed(decimals);
    }

    // Turns "02 September 2026, 06:12 AM IST" into a compact "02/09 06:12"
    function formatTimestamp(ts) {
      if (!ts) return "--/-- --:--";
      const d = new Date(ts.replace(" IST", ""));
      if (isNaN(d.getTime())) return ts;
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const hh = String(d.getHours()).padStart(2, "0");
      const mi = String(d.getMinutes()).padStart(2, "0");
      return `${dd}/${mm} ${hh}:${mi}`;
    }

    async function updateDashboard() {
      try {
        const res = await fetch(API_URL, { cache: "no-store" });
        const data = await res.json();

        el.title.textContent = (data.machine && data.machine.name) || "AAQMS";
        el.screen.classList.toggle("offline", !(data.machine && data.machine.is_online));

        let latestTs = null;

        (data.sensors || []).forEach(sensor => {
          const target = sensorMap[sensor.type];
          if (!target) return;
          const reading = sensor.readings && sensor.readings[0];
          if (!reading) return;

          const decimals = (sensor.type === "PM2.5" || sensor.type === "PM10" || sensor.type === "AQI") ? 0 : 1;
          target.textContent = formatValue(reading.value, decimals);

          if (reading.timestamp && !latestTs) latestTs = reading.timestamp;
        });

        el.datetime.textContent = formatTimestamp(latestTs);
      } catch (err) {
        console.error("AAQMS fetch error:", err);
        el.datetime.textContent = "OFFLINE";
        el.screen.classList.add("offline");
      }
    }

    updateDashboard();
    setInterval(updateDashboard, REFRESH_MS);
  </script>
</body>
</html>
